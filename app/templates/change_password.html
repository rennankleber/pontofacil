{% extends "base.html" %}
{% block title %}Alterar senha | PontoFácil{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card"><div class="card-body p-4">
    <h1 class="h3 mb-3">Alterar senha</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="current_password">Senha atual</label>
      <input class="form-control mb-3" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      <label class="form-label" for="new_password">Nova senha (mínimo 8 caracteres)</label>
      <input class="form-control mb-3" id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
      <label class="form-label" for="confirmation">Confirme a nova senha</label>
      <input class="form-control mb-3" id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
      <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
